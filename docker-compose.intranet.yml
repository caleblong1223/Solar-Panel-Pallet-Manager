services:
  postgres:
    image: postgres:16
    container_name: pallet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pallet_manager
      POSTGRES_USER: pallet_user
      POSTGRES_PASSWORD: pallet_pass
    ports:
      - "5433:5432"
    volumes:
      - pallet_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: pallet_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pallet_minio_data:/data

  backend:
    build:
      context: ./backend
    container_name: pallet_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://pallet_user:pallet_pass@postgres:5432/pallet_manager
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
    depends_on:
      - postgres
      - minio
    ports:
      - "8001:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pallet_postgres_data:
  pallet_minio_data:
