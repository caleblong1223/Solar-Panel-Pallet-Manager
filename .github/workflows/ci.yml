name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop/2.0

jobs:
  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run performance smoke tests
        env:
          PM_CI_STARTUP_LIMIT_S: "4.0"
          PM_CI_SCAN_BATCH_LIMIT_S: "2.5"
          PM_CI_SCAN_RELATIVE_FACTOR: "0.7"
        run: |
          python -m pytest -q tests/test_ci_perf_smoke.py tests/test_history_indexed_filtering.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend pytest

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite+pysqlite:///./backend/test.db
          JWT_SECRET: ci-test-secret
          MINIO_ACCESS_KEY: ci-minio-access
          MINIO_SECRET_KEY: ci-minio-secret
        run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run frontend e2e tests
        run: npm run test:e2e
        working-directory: frontend

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            frontend/test-results
            frontend/playwright-report
